name: Deploy Pages

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: npx ng build creative-web-development --configuration production --base-href /Creative-Web-Development/

      - name: Fix index.html for GitHub Pages
        run: cp ./dist/creative-web-development/browser/index.csr.html ./dist/creative-web-development/browser/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/creative-web-development/browser